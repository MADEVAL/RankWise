name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyyaml
      - name: Run validator tests
        run: python -m pytest -q
      - name: Check skill frontmatter and relative links
        run: |
          python - <<'PY'
          import os, re, sys
          import yaml
          text = open("SKILL.md", encoding="utf-8").read()
          m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
          if not m:
              sys.exit("SKILL.md: missing frontmatter")
          fm = yaml.safe_load(m.group(1))
          for field in ("name", "description", "license", "compatibility"):
              if not fm.get(field):
                  sys.exit(f"SKILL.md: missing {field}")
          if not str(fm.get("metadata", {}).get("version", "")).count(".") == 2:
              sys.exit("SKILL.md: metadata.version must be X.Y.Z")
          missing = []
          body = re.sub(r"```.*?```", "", text, flags=re.S)
          for path in re.findall(r"\]\(([^)]+)\)", body):
              if not path.startswith(("shared/", "scenarios/", "examples/", "references/", "validator/", "tests/")):
                  continue
              if not os.path.exists(path):
                  missing.append(path)
          if missing:
              sys.exit("SKILL.md: broken relative links: " + ", ".join(sorted(set(missing))))
          print("frontmatter and links OK")
          PY
