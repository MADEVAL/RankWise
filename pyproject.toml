[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rankwise-validator"
version = "1.5.0"
description = "Deterministic SEO metric computation + automated fix orchestration for RankWise - 16 of 49 factors"
requires-python = ">=3.10"
dependencies = [
    "readsight>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
rankwise-validator = "validator.cli:main"

[tool.setuptools]
package-dir = {"" = "skills/rankwise"}
packages = ["validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-v", "--tb=short"]
